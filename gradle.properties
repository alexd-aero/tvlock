org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Building on a Raspberry Pi (linux-aarch64): the aapt2 AGP fetches from Maven is
# x86_64-only, so point it at the aarch64 build in the local SDK.
android.aapt2FromMavenOverride=/home/rasp-alex2/android-sdk/build-tools/35.0.0/aapt2
# Faster builds on the Pi: keep the daemon warm, reuse the configuration, build in parallel.
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.parallel=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx1536m
